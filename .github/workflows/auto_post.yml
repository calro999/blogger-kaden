name: Auto Post to Blogger

on:
  schedule:
    # 2時間おき (偶数時の15分) に実行 (GitHub Actions混雑回避のためオフセット設定)
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Auto Post Script
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          BLOGGER_SESSION_B64: ${{ secrets.BLOGGER_SESSION_B64 }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          ROOM_SESSION_B64: ${{ secrets.ROOM_SESSION_B64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python kaden_blogger.py

      - name: Commit and Push Cache Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f posted_cache.txt ]; then
            git add posted_cache.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore: update posted cache [skip ci]"
              git pull --rebase origin main || true
              git push origin main || git push || true
            fi
          fi
